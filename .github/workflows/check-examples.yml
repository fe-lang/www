name: Check Fe Examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-fe-wrapper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/fe
          chmod +x scripts/test-fe-wrapper.sh

      - name: Smoke test Fe wrapper
        run: ./scripts/test-fe-wrapper.sh

  check-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/fe
          chmod +x scripts/extract-fe-blocks.sh
          chmod +x scripts/check-examples.sh

      - name: Check Fe code examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:examples:verbose
